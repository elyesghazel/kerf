[package]
name = "kerf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless kerf: the agent-facing CLI and MCP server"

[[bin]]
name = "kerf"
path = "src/main.rs"

[dependencies]
kerf-core = { workspace = true }
kerf-media = { workspace = true }
kerf-render = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true, features = ["env"] }
png = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
